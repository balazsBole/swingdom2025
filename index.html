		<!-- Single reusable modal -->
		<div id="genericModal" class="modal">
			<div class="modal-content">
				<span id="genericModalClose" class="close">&times;</span>
				<div class="container">

		<!-- Scripts -->

			<script src="assets/js/main.js"></script>

	<script>
		const modal = document.getElementById("genericModal");
		const modalTitle = document.getElementById("modalTitle");
		const modalText = document.getElementById("modalText");
		const modalClose = document.getElementById("genericModalClose");

		// Open modal with dynamic content
		document.querySelectorAll(".modal-trigger").forEach(item => {
			item.addEventListener("click", () => {
				const title = item.getAttribute("data-title");
				const textId = item.getAttribute("data-text-id");
				const textHtml = document.getElementById(textId).innerHTML;

				modalTitle.innerText = title;
				modalText.innerHTML = textHtml;
				modal.style.display = "block";
			});
		});

		// Close modal
		modalClose.onclick = function () {
			modal.style.display = "none";
		};

		// Close modal when clicking outside of it
		window.onclick = function (event) {
			if (event.target == modal) {
				modal.style.display = "none";
			}
		};

	</script>
